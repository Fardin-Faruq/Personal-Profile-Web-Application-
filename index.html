<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration</title>
</head>
<body>

    <h1>Student Event Registration</h1>

    <h2>Tech Fest 2026</h2>

    <p>
        Join us for our annual college technical festival featuring
        workshops, coding competitions and technical events.
    </p>

    <form>
        <label>Student Name:</label><br>
        <input type="text" name="name"><br><br>

        <label>Register Number:</label><br>
        <input type="text" name="regno"><br><br>

        <label>Department:</label><br>
        <input type="text" name="department"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Event Date:</label><br>
        <input type="date" name="date"><br><br>

        <button type="submit">Register</button>
    </form>

</body>
</html>
